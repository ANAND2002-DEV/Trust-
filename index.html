<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050611">
<title>Trust in the Stars</title>
<style>
  :root { color-scheme: dark; --red:#ff244f; --pink:#ff7891; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; min-height:100%; overflow:hidden; }
  body {
    min-height:100svh; background:radial-gradient(ellipse at 50% 48%, #17102c 0%, #090a1d 42%, #03040c 100%);
    color:#fff; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    touch-action:none; user-select:none;
  }
  #sky { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
  .nebula { position:fixed; inset:-20%; z-index:0; pointer-events:none; opacity:.4;
    background:radial-gradient(ellipse at 22% 28%, #33245d55, transparent 32%),
               radial-gradient(ellipse at 78% 65%, #651c3d33, transparent 34%),
               radial-gradient(ellipse at 50% 100%, #1c376044, transparent 40%);
    filter:blur(32px); animation: drift 24s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:translate3d(3%, -2%, 0) scale(1.08); } }
  .heading { position:fixed; z-index:2; top:clamp(22px,5vh,52px); left:0; width:100%; text-align:center; pointer-events:none; }
  .eyebrow { color:#c4b5d9; font-size:10px; letter-spacing:.42em; text-transform:uppercase; opacity:.8; }
  h1 { margin:10px 0 0; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
       font-size:clamp(19px,4vw,30px); text-shadow:0 0 24px #e94d7966; }
  .stage { position:fixed; inset:0; display:grid; place-items:center; z-index:1; }
  #heartMover { position:absolute; width:min(72vw, 390px); aspect-ratio:1; display:grid; place-items:center;
    transform:translate3d(0,0,0); cursor:grab; touch-action:none; will-change:transform; }
  #heartMover.dragging { cursor:grabbing; }
  .heart-wrap { width:100%; height:100%; position:relative; filter:drop-shadow(0 0 20px #ff174855) drop-shadow(0 0 55px #fa315533); }
  .heart-svg { width:100%; height:100%; overflow:visible; }
  .heart-outline { fill:#160812; stroke:#ff6b89; stroke-width:1.7; opacity:.96; }
  .heart-glass { fill:url(#glass); opacity:.58; }
  .liquid { transition: y 1s ease; }
  .shine { fill:none; stroke:#ffd5df; stroke-width:2.2; stroke-linecap:round; opacity:.55; }
  .heart-glow { fill:none; stroke:#ff315c; stroke-width:8; opacity:.17; filter:blur(8px); }
  .value { position:absolute; top:50%; left:50%; transform:translate(-50%,-35%); text-align:center; width:75%; pointer-events:none; }
  .number { font-size:clamp(38px,9vw,65px); line-height:1; font-weight:300; letter-spacing:-.05em;
    text-shadow:0 0 18px #ff315c99, 0 0 42px #ff315c55; }
  .unit { margin-top:9px; font-size:11px; letter-spacing:.34em; color:#ffe0e7; text-transform:uppercase; }
  .scale { margin-top:8px; font-size:10px; letter-spacing:.18em; color:#d9bdc8; opacity:.75; }
  .hint { position:fixed; z-index:2; bottom:clamp(25px,6vh,55px); left:0; width:100%; text-align:center;
    color:#c9bdd2; font-size:11px; letter-spacing:.14em; opacity:.78; pointer-events:none; }
  .hint span { color:#ff8da4; }
  @media (prefers-reduced-motion: reduce) { .nebula { animation:none; } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas><div class="nebula"></div>
<header class="heading"><div class="eyebrow">A universe of feelings</div><h1>Trust in the Stars</h1></header>
<main class="stage">
  <div id="heartMover" aria-label="Drag the heart around the screen">
    <div class="heart-wrap">
      <svg class="heart-svg" viewBox="0 0 400 370" role="img" aria-label="Glowing glass heart with red liquid">
        <defs>
          <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#ff8ca5" stop-opacity=".05"/><stop offset="1" stop-color="#ff315c" stop-opacity=".18"/>
          </linearGradient>
          <linearGradient id="redLiquid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff8296"/><stop offset=".25" stop-color="#ff315c"/><stop offset="1" stop-color="#a90035"/>
          </linearGradient>
          <clipPath id="heartClip"><path d="M200 337 C172 311 35 215 35 116 C35 47 119 18 200 104 C281 18 365 47 365 116 C365 215 228 311 200 337Z"/></clipPath>
          <filter id="liquidGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
        </defs>
        <path class="heart-glow" d="M200 337 C172 311 35 215 35 116 C35 47 119 18 200 104 C281 18 365 47 365 116 C365 215 228 311 200 337Z"/>
        <g clip-path="url(#heartClip)">
          <rect x="25" y="20" width="350" height="330" fill="#190a16" opacity=".78"/>
          <g class="liquid" id="liquidGroup">
            <path d="M20 325 Q110 317 200 325 T380 325 L380 360 L20 360Z" fill="url(#redLiquid)"/>
            <path d="M20 325 Q110 317 200 325 T380 325" fill="none" stroke="#ffb0c0" stroke-width="3" opacity=".9"/>
            <path d="M20 328 Q110 320 200 328 T380 328" fill="none" stroke="#ff315c" stroke-width="9" filter="url(#liquidGlow)" opacity=".9"/>
          </g>
          <path d="M65 115 Q75 55 133 66" class="shine" opacity=".42"/>
          <path d="M85 90 Q105 69 127 72" class="shine"/>
        </g>
        <path class="heart-glass" d="M200 337 C172 311 35 215 35 116 C35 47 119 18 200 104 C281 18 365 47 365 116 C365 215 228 311 200 337Z"/>
        <path class="heart-outline" fill="none" d="M200 337 C172 311 35 215 35 116 C35 47 119 18 200 104 C281 18 365 47 365 116 C365 215 228 311 200 337Z"/>
        <path d="M76 125 Q76 76 124 68" class="shine"/>
      </svg>
      <div class="value"><div class="number" id="trustValue">45%</div><div class="unit">Trust level</div><div class="scale">OUT OF 1000%</div></div>
    </div>
  </div>
</main>
<div class="hint">TOUCH &amp; DRAG <span>·</span> MOVE THE HEART THROUGH THE NIGHT</div>
<script>
(() => {
  const canvas = document.getElementById('sky'), ctx = canvas.getContext('2d');
  let w, h, stars = [], dpr = Math.min(devicePixelRatio || 1, 2);
  function resize() {
    w = innerWidth; h = innerHeight; canvas.width = w*dpr; canvas.height = h*dpr;
    canvas.style.width = w+'px'; canvas.style.height = h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
    stars = Array.from({length: Math.min(420, Math.floor(w*h/2300))}, () => ({
      x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.35+.2,
      a:Math.random()*.65+.2, speed:Math.random()*.018+.003, phase:Math.random()*Math.PI*2
    }));
  }
  function draw(t) {
    ctx.clearRect(0,0,w,h);
    for (const s of stars) {
      const twinkle = .55 + .45*Math.sin(t*s.speed+s.phase);
      ctx.globalAlpha = s.a*twinkle; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      if (s.r>1.15) { ctx.globalAlpha *= .45; ctx.fillRect(s.x-3,s.y-.35,6,.7); ctx.fillRect(s.x-.35,s.y-3,.7,6); }
    }
    ctx.globalAlpha=1; requestAnimationFrame(draw);
  }
  addEventListener('resize', resize); resize(); requestAnimationFrame(draw);

  // The displayed score is 45 on a 0–1000 scale, so the liquid occupies 4.5% of the heart.
  const score = 45, maxScore = 1000, fill = score/maxScore;
  const group = document.getElementById('liquidGroup');
  const top = 325 - fill*270;
  group.style.transform = `translateY(${top-325}px)`;

  // Drag with mouse or finger. The heart follows the pointer, clamped to the visible screen.
  const mover = document.getElementById('heartMover');
  let active=false, startX=0, startY=0, originX=0, originY=0, x=0, y=0;
  function down(e) {
    active=true; mover.classList.add('dragging'); mover.setPointerCapture(e.pointerId);
    startX=e.clientX; startY=e.clientY; originX=x; originY=y;
  }
  function move(e) {
    if (!active) return;
    const rect=mover.getBoundingClientRect(), halfW=rect.width/2, halfH=rect.height/2;
    const maxX=Math.max(0,innerWidth/2-halfW-8), maxY=Math.max(0,innerHeight/2-halfH-8);
    x=Math.max(-maxX,Math.min(maxX,originX+e.clientX-startX));
    y=Math.max(-maxY,Math.min(maxY,originY+e.clientY-startY));
    mover.style.transform=`translate3d(${x}px,${y}px,0)`;
  }
  function up(){ active=false; mover.classList.remove('dragging'); }
  mover.addEventListener('pointerdown',down);
  mover.addEventListener('pointermove',move);
  mover.addEventListener('pointerup',up);
  mover.addEventListener('pointercancel',up);
})();
</script>
</body>
</html>
