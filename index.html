<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Among The Galaxies - Trust Meter</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-center: #2a1454;
            --bg-mid: #130926;
            --accent-glow: rgba(168, 85, 247, 0.55);
            --text-glow: rgba(192, 132, 252, 0.85);
            --wave-back: rgba(139, 92, 246, 0.52);
            --liq-top: rgba(192, 132, 252, 0.85);
            --liq-mid: rgba(126, 34, 206, 0.88);
            --liq-bot: rgba(59, 7, 100, 0.95);
            --stroke-main: #e9d5ff;
            --btn-grad: linear-gradient(135deg, #7e22ce, #a855f7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, var(--bg-center) 0%, var(--bg-mid) 48%, #06030d 100%);
            color: #f3e8ff;
            font-family: 'Cinzel', serif;
            position: fixed;
            inset: 0;
            transition: background 1s ease;
            touch-action: none;
        }

        .cosmic-frame {
            position: fixed;
            inset: 14px;
            border: 1px solid rgba(216, 180, 254, 0.16);
            border-radius: 10px;
            pointer-events: none;
            z-index: 4;
        }

        #sky-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: crosshair;
        }

        .center-anchor {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            pointer-events: none;
            padding: 0 24px;
        }

        .top-caption, .bottom-caption {
            font-size: 0.88rem;
            letter-spacing: 5px;
            color: rgba(243, 232, 255, 0.9);
            text-transform: uppercase;
            text-shadow: 0 0 12px var(--text-glow);
            user-select: none;
            text-align: center;
            width: 100%;
        }

        .top-caption { margin-bottom: 14px; }
        .bottom-caption { margin-top: 14px; }

        .streak-badge {
            margin-top: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: rgba(233, 213, 255, 0.72);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 14px;
            border-radius: 20px;
            text-align: center;
        }

        .milestone-pill {
            margin-top: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 10px var(--text-glow);
            opacity: 0.85;
        }

        .heart-stage {
            position: relative;
            width: 270px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatHeart 5s ease-in-out infinite;
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }

        .orbit-svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140vw;
            max-width: 540px;
            height: auto;
            pointer-events: none;
            z-index: 1;
            overflow: visible;
        }

        .heart-svg {
            position: relative;
            width: 255px;
            height: 235px;
            z-index: 2;
            overflow: visible;
            filter: drop-shadow(0 0 22px var(--accent-glow));
            transition: filter 0.8s ease;
        }

        .water-group {
            transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .wave-back {
            fill: var(--wave-back);
            animation: waveMove 7s linear infinite;
            transition: fill 0.8s ease;
        }

        .wave-front {
            fill: url(#liquidGradient);
            animation: waveMove 4.5s linear infinite reverse;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-200px); }
        }

        .inside-meter {
            position: absolute;
            z-index: 4;
            top: 47%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            width: 200px;
        }

        .inside-percentage {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.95rem;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.9), 0 0 28px var(--text-glow);
            line-height: 1.1;
        }

      .inside-max {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: #e9d5ff;
            margin-top: 3px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        }

        .inside-label {
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(243, 232, 255, 0.85);
            margin-top: 5px;
        }

        .corner-btn {
            position: fixed;
            bottom: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(233, 213, 255, 0.55);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .corner-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
        }

        #music-toggle { left: 20px; }
        #admin-trigger {
            right: 20px;
            background: transparent;
            border-color: transparent;
            color: rgba(233, 213, 255, 0.18);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(6, 3, 13, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            font-family: 'Montserrat', sans-serif;
            padding: 16px;
        }

        .modal-box {
            background: #150b2b;
            border: 1px solid rgba(216, 180, 254, 0.25);
            padding: 22px;
            border-radius: 16px;
            width: 100%;
            max-width: 370px;
            max-height: 88dvh;
            overflow-y: auto;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8);
            text-align: left;
        }

        .modal-box h3 {
            font-family: 'Cinzel', serif;
            margin-bottom: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #f3e8ff;
            text-align: center;
        }

        .field-label {
            display: block;
            font-size: 0.72rem;
            color: #c4b5fd;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .modal-box input, .modal-box select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid rgba(192, 132, 252, 0.3);
            background: #0c051a;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .modal-box input:focus, .modal-box select:focus {
            border-color: #c084fc;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--btn-grad);
            color: white;
        }

        .btn-secondary {
            background: #271947;
            color: #d8b4fe;
        }

        .error-msg {
            color: #fda4af;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: none;
            text-align: center;
        }
      @media (min-width: 768px) {
            .heart-stage { width: 330px; height: 300px; }
            .heart-svg { width: 295px; height: 270px; }
            .inside-percentage { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="cosmic-frame"></div>
    <canvas id="sky-canvas"></canvas>

    <div class="center-anchor">
        <div class="top-caption" id="ui-top-caption">Among The Galaxies</div>

        <div class="heart-stage">
            <svg class="orbit-svg" viewBox="0 0 540 360">
                <path d="M270,315 C270,315 110,205 110,105 C110,50 152,18 198,18 C230,18 256,36 270,58 C284,36 310,18 342,18 C388,18 430,50 430,105 C430,205 270,315 270,315 Z"
                      fill="none" stroke="rgba(216, 180, 254, 0.08)" stroke-width="1" />
                <path d="M270,335 C270,335 90,215 90,102 C90,40 138,4 190,4 C226,4 254,24 270,48 C286,24 314,4 350,4 C402,4 450,40 450,102 C450,215 270,335 270,335 Z"
                      fill="none" stroke="rgba(216, 180, 254, 0.05)" stroke-width="1" />
                
                <path d="M 35,215 Q 240,320 495,125" fill="none" stroke="rgba(233, 213, 255, 0.28)" stroke-width="1" />
                <circle cx="115" cy="246" r="2.5" fill="#ffffff" />
                <circle cx="495" cy="125" r="3.5" fill="#ffffff" />
                <circle cx="495" cy="125" r="9" fill="none" stroke="rgba(233, 213, 255, 0.35)" stroke-width="1" />
            </svg>

            <svg class="heart-svg" viewBox="0 0 200 185">
                <defs>
                    <clipPath id="heart-clip">
                        <path d="M100,175 C100,175 15,115 15,58 C15,28 38,10 64,10 C82,10 95,20 100,32 C105,20 118,10 136,10 C162,10 185,28 185,58 C185,115 100,175 100,175 Z" />
                    </clipPath>

                    <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop id="grad-stop-1" offset="0%" stop-color="rgba(192, 132, 252, 0.85)" />
                        <stop id="grad-stop-2" offset="55%" stop-color="rgba(126, 34, 206, 0.88)" />
                        <stop id="grad-stop-3" offset="100%" stop-color="rgba(59, 7, 100, 0.95)" />
                    </linearGradient>

                    <radialGradient id="heartInnerGlow" cx="50%" cy="48%" r="55%">
                        <stop offset="0%" stop-color="rgba(168, 85, 247, 0.22)" />
                        <stop offset="100%" stop-color="rgba(19, 9, 38, 0.55)" />
                    </radialGradient>

                    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="2.2" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>
                  <path d="M100,175 C100,175 15,115 15,58 C15,28 38,10 64,10 C82,10 95,20 100,32 C105,20 118,10 136,10 C162,10 185,28 185,58 C185,115 100,175 100,175 Z" 
                      fill="url(#heartInnerGlow)" />

                <g clip-path="url(#heart-clip)">
                    <g id="water-level" class="water-group" transform="translate(0, 160)">
                        <path class="wave-back" d="M0,10 Q50,2 100,10 T200,10 T300,10 T400,10 V200 H0 Z" />
                        <path class="wave-front" d="M0,12 Q50,20 100,12 T200,12 T300,12 T400,12 V200 H0 Z" />
                        <path class="wave-front" d="M0,12 Q50,20 100,12 T200,12 T300,12 T400,12" fill="none" stroke="rgba(255, 255, 255, 0.65)" stroke-width="1.2" />
                    </g>

                    <circle cx="62" cy="72" r="1" fill="#fff" opacity="0.7" />
                    <circle cx="138" cy="96" r="1.2" fill="#fff" opacity="0.8" />
                    <circle cx="75" cy="112" r="0.9" fill="#e9d5ff" opacity="0.6" />
                    <circle cx="128" cy="64" r="1" fill="#e9d5ff" opacity="0.7" />
                </g>

                <path id="heart-outline-path" d="M100,175 C100,175 15,115 15,58 C15,28 38,10 64,10 C82,10 95,20 100,32 C105,20 118,10 136,10 C162,10 185,28 185,58 C185,115 100,175 100,175 Z" 
                      fill="none" stroke="#e9d5ff" stroke-width="2.2" filter="url(#starGlow)" />

                <g fill="#ffffff" filter="url(#starGlow)">
                    <circle cx="100" cy="32" r="2.6" />
                    <circle cx="64" cy="10" r="2.2" />
                    <circle cx="136" cy="10" r="2.2" />
                    <circle cx="24" cy="34" r="2" />
                    <circle cx="176" cy="34" r="2" />
                    <circle cx="15" cy="62" r="2.4" />
                    <circle cx="185" cy="62" r="2.4" />
                    <circle cx="32" cy="106" r="2" />
                    <circle cx="168" cy="106" r="2" />
                    <circle cx="65" cy="146" r="1.8" />
                    <circle cx="135" cy="146" r="1.8" />
                    <circle cx="100" cy="175" r="2.8" />
                </g>
            </svg>

            <div class="inside-meter">
                <div class="inside-percentage"><span id="trust-value">50</span>%</div>
                <div class="inside-max">OUT OF 1000%</div>
                <div class="inside-label">Trust Meter</div>
            </div>
        </div>

        <div class="bottom-caption" id="ui-bottom-caption">I Found You</div>
        <div class="milestone-pill" id="ui-milestone">✦ETERNAL US✦</div>
        <div class="streak-badge" id="ui-streak">Day 1 of growing together</div>
    </div>

    <button id="music-toggle" class="corner-btn" title="Play / Mute Music">🔇</button>
    <button id="track-switch" class="corner-btn" style="left: 64px;" title="Change Melody">🎵</button>
    <div id="track-toast" style="position: fixed; bottom: 64px; left: 20px; z-index: 10; font-family: 'Montserrat', sans-serif; font-size: 0.72rem; letter-spacing: 1px; color: #f3e8ff; background: rgba(21, 11, 43, 0.85); border: 1px solid rgba(216, 180, 254, 0.25); padding: 6px 12px; border-radius: 20px; opacity: 0; transition: opacity 0.4s ease; pointer-events: none;"></div>
    <button id="admin-trigger" class="corner-btn" title="Settings">⚙️</button>

    <div id="admin-modal" class="modal-overlay">
        <div class="modal-box" id="login-view">
            <h3>Admin Access</h3>
            <div id="login-error" class="error-msg">Invalid username or password</div>
            <label class="field-label">Username</label>
            <input type="text" id="admin-user" placeholder="Username" autocomplete="off">
            <label class="field-label">Password</label>
            <input type="password" id="admin-pass" placeholder="Password">
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="verifyLogin()">Login</button>
            </div>
        </div>

        <div class="modal-box" id="edit-view" style="display: none;">
            <h3>Admin Controls</h3>

            <label class="field-label">Trust Percentage (0 – 1000%, +5% daily)</label>
            <input type="number" id="new-percentage" min="0" max="1000" step="1">

            <label class="field-label">Liquid Color Theme</label>
            <select id="theme-select">
                <option value="violet">Cosmic Violet (Default)</option>
                <option value="rose">Rose Nebula (Pink / Crimson)</option>
                <option value="cyan">Ocean Cyan (Deep Blue / Aqua)</option>
                <option value="emerald">Aurora Emerald (Teal / Green)</option>
            </select>

            <label class="field-label">Default Background Melody</label>
            <select id="music-select">
                <option value="clair">Clair de Lune (Romantic Piano)</option>
                <option value="moonlight">Moonlight Serenade (Emotional Piano)</option>
                <option value="musicbox">Starlight Music Box (Chimes)</option>
                <option value="space">Deep Cosmic Space Pad</option>
            </select>

            <label class="field-label">Top Caption</label>
            <input type="text" id="edit-top-caption" placeholder="Among The Galaxies">

            <label class="field-label">Bottom Caption</label>
            <input type="text" id="edit-bottom-caption" placeholder="I Found You">

            <label class="field-label">Current Day Number (Auto +1 daily)</label>
            <input type="number" id="edit-day-number" min="1" step="1">

            <label class="field-label">Day Counter Caption (Use {day} for number)</label>
            <input type="text" id="edit-streak-caption" placeholder="Day {day} of growing together">

            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                <button class="btn btn-primary" id="save-btn" onclick="saveAdminSettings()">Save All</button>
            </div>
        </div>
    </div>
    <script>
        // PASTE YOUR FIREBASE DATABASE URL BELOW (No trailing slash)
        const FIREBASE_DB_URL = "PASTE_YOUR_FIREBASE_URL_HERE";
        // 1. Liquid & Galaxy Themes
        const THEMES = {
            violet: {
                bgCenter: '#2a1454', bgMid: '#130926',
                accentGlow: 'rgba(168, 85, 247, 0.55)', textGlow: 'rgba(192, 132, 252, 0.85)',
                waveBack: 'rgba(139, 92, 246, 0.52)',
                liqTop: 'rgba(192, 132, 252, 0.85)', liqMid: 'rgba(126, 34, 206, 0.88)', liqBot: 'rgba(59, 7, 100, 0.95)',
                stroke: '#e9d5ff', btnGrad: 'linear-gradient(135deg, #7e22ce, #a855f7)'
            },
            rose: {
                bgCenter: '#4c1130', bgMid: '#1f0714',
                accentGlow: 'rgba(244, 63, 94, 0.55)', textGlow: 'rgba(251, 113, 133, 0.85)',
                waveBack: 'rgba(225, 29, 72, 0.48)',
                liqTop: 'rgba(251, 113, 133, 0.85)', liqMid: 'rgba(190, 18, 60, 0.88)', liqBot: 'rgba(88, 12, 31, 0.95)',
                stroke: '#ffe4e6', btnGrad: 'linear-gradient(135deg, #be123c, #f43f5e)'
            },
            cyan: {
                bgCenter: '#0c3547', bgMid: '#051622',
                accentGlow: 'rgba(56, 189, 248, 0.55)', textGlow: 'rgba(125, 211, 252, 0.85)',
                waveBack: 'rgba(2, 132, 199, 0.48)',
                liqTop: 'rgba(56, 189, 248, 0.85)', liqMid: 'rgba(3, 105, 161, 0.88)', liqBot: 'rgba(8, 47, 73, 0.95)',
                stroke: '#e0f2fe', btnGrad: 'linear-gradient(135deg, #0369a1, #0ea5e9)'
            },
            emerald: {
                bgCenter: '#0d3b2e', bgMid: '#051c16',
                accentGlow: 'rgba(52, 211, 153, 0.55)', textGlow: 'rgba(110, 231, 183, 0.85)',
                waveBack: 'rgba(5, 150, 105, 0.48)',
                liqTop: 'rgba(52, 211, 153, 0.85)', liqMid: 'rgba(4, 120, 87, 0.88)', liqBot: 'rgba(6, 78, 59, 0.95)',
                stroke: '#d1fae5', btnGrad: 'linear-gradient(135deg, #047857, #10b981)'
            }
        };

        function applyTheme(themeKey) {
            const t = THEMES[themeKey] || THEMES.violet;
            const r = document.documentElement.style;
            r.setProperty('--bg-center', t.bgCenter);
            r.setProperty('--bg-mid', t.bgMid);
            r.setProperty('--accent-glow', t.accentGlow);
            r.setProperty('--text-glow', t.textGlow);
            r.setProperty('--wave-back', t.waveBack);
            r.setProperty('--btn-grad', t.btnGrad);
            document.getElementById('grad-stop-1').setAttribute('stop-color', t.liqTop);
            document.getElementById('grad-stop-2').setAttribute('stop-color', t.liqMid);
            document.getElementById('grad-stop-3').setAttribute('stop-color', t.liqBot);
            document.getElementById('heart-outline-path').setAttribute('stroke', t.stroke);
        }

        // 2. Interactive Star Constellations & Multi-Directional Shooting Stars
        const canvas = document.getElementById('sky-canvas');
        const ctx = canvas.getContext('2d');
        let bgStars = [];
        let shootingStars = [];
        let pointer = { x: null, y: null, active: false };

        function initSky() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            bgStars = [];
            const count = Math.min(160, Math.floor((canvas.width * canvas.height) / 5500));
            for (let i = 0; i < count; i++) {
                bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.8 + 0.6,
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.03 + 0.01
                });
            }
        }
        window.addEventListener('resize', initSky);
        initSky();

        function updatePointer(e) {
            const touch = e.touches ? e.touches[0] : e;
            pointer.x = touch.clientX;
            pointer.y = touch.clientY;
            pointer.active = true;
        }
        
        canvas.addEventListener('mousemove', updatePointer);
        canvas.addEventListener('touchstart', (e) => {
            updatePointer(e);
            shootingStars.push(new ShootingStar(pointer.x, pointer.y));
        }, { passive: true });
        canvas.addEventListener('touchmove', updatePointer, { passive: true });
        canvas.addEventListener('mouseleave', () => { pointer.active = false; });
        canvas.addEventListener('touchend', () => { pointer.active = false; });
        canvas.addEventListener('click', (e) => {
            shootingStars.push(new ShootingStar(e.clientX, e.clientY));
        });

        class ShootingStar {
            constructor(targetX = null, targetY = null) {
                const edge = Math.floor(Math.random() * 4);
                const w = canvas.width;
                const h = canvas.height;
                let angle;

                if (edge === 0) { this.x = Math.random() * w; this.y = -30; angle = (Math.random() * 110 + 35) * (Math.PI / 180); }
                else if (edge === 1) { this.x = w + 30; this.y = Math.random() * h; angle = (Math.random() * 110 + 125) * (Math.PI / 180); }
                else if (edge === 2) { this.x = Math.random() * w; this.y = h + 30; angle = (Math.random() * 110 + 215) * (Math.PI / 180); }
                else { this.x = -30; this.y = Math.random() * h; angle = (Math.random() * 110 - 55) * (Math.PI / 180); }

                if (targetX !== null && targetY !== null) {
                    angle = Math.atan2(targetY - this.y, targetX - this.x);
                }

                this.speed = Math.random() * 9 + 7;
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
                this.length = Math.random() * 110 + 75;
                this.size = Math.random() * 1.6 + 1.2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                const m = 180;
                return !(this.x < -m || this.x > canvas.width + m || this.y < -m || this.y > canvas.height + m);
            }

            draw() {
                const tailX = this.x - (this.vx / this.speed) * this.length;
                const tailY = this.y - (this.vy / this.speed) * this.length;
                const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                grad.addColorStop(0.35, 'rgba(233, 213, 255, 0.5)');
                grad.addColorStop(1, 'rgba(168, 85, 247, 0)');

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(tailX, tailY);
                ctx.strokeStyle = grad;
                ctx.lineWidth = this.size;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 1.4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
            }
        }

        setInterval(() => {
            if (shootingStars.length < 5) shootingStars.push(new ShootingStar());
        }, 1200);

        function animateSky() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const nearStars = [];
            for (const s of bgStars) {
                s.phase += s.speed;
                const alpha = 0.25 + 0.7 * (0.5 + 0.5 * Math.sin(s.phase));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();

                if (pointer.active) {
                    const dist = Math.hypot(s.x - pointer.x, s.y - pointer.y);
                    if (dist < 130) nearStars.push({ star: s, dist });
                }
            }

            if (pointer.active && nearStars.length > 0) {
                for (let i = 0; i < nearStars.length; i++) {
                    const a = nearStars[i];
                    ctx.beginPath();
                    ctx.moveTo(pointer.x, pointer.y);
                    ctx.lineTo(a.star.x, a.star.y);
                    ctx.strokeStyle = `rgba(233, 213, 255, ${(1 - a.dist / 130) * 0.45})`;
                    ctx.lineWidth = 0.9;
                    ctx.stroke();

                    for (let j = i + 1; j < nearStars.length; j++) {
                        const b = nearStars[j];
                        const pairDist = Math.hypot(a.star.x - b.star.x, a.star.y - b.star.y);
                        if (pairDist < 110) {
                            ctx.beginPath();
                            ctx.moveTo(a.star.x, a.star.y);
                            ctx.lineTo(b.star.x, b.star.y);
                            ctx.strokeStyle = `rgba(216, 180, 254, ${(1 - pairDist / 110) * 0.55})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
                        }
            shootingStars = shootingStars.filter(star => {
                const alive = star.update();
                if (alive) star.draw();
                return alive;
            });

            requestAnimationFrame(animateSky);
        }
        animateSky();
        // 3. Romantic Piano & Ambient Multi-Track Synthesizer
        let audioCtx = null;
        let isPlaying = false;
        let masterGain = null;
        let melodyTimer = null;
        let spaceNodes = [];
        let noteStep = 0;

        const TRACKS = {
            clair: {
                name: '🎹 Clair de Lune (Romantic Piano)',
                tempo: 520,
                type: 'piano',
                notes: [
                    [61, 65, 68], 77, 73, 68, 65, 68, 73, 77,
                    [58, 61, 65], 73, 70, 65, 61, 65, 70, 73,
                    [54, 61, 66], 73, 70, 66, 61, 66, 70, 73,
                    [56, 63, 68], 75, 72, 68, 63, 68, 72, 75
                ]
            },
            moonlight: {
                name: '🎹 Moonlight Serenade (Emotional Piano)',
                tempo: 580,
                type: 'piano',
                notes: [
                    [49, 56], 61, 64, 68, 64, 68, 61, 64,
                    [45, 52], 61, 64, 69, 64, 69, 61, 64,
                    [40, 47], 59, 64, 68, 64, 68, 59, 64,
                    [47, 54], 59, 63, 66, 63, 66, 59, 63
                ]
            },
            musicbox: {
                name: '✨ Starlight Music Box',
                tempo: 460,
                type: 'chime',
                notes: [
                    76, 83, 81, 79, 76, 79, 81, 83,
                    74, 81, 79, 78, 74, 78, 79, 81,
                    72, 79, 78, 76, 72, 76, 78, 79,
                    71, 78, 76, 74, 71, 74, 76, 79
                ]
            },
            space: {
                name: '🌌 Deep Cosmic Space Pad',
                type: 'pad'
            }
        };

        const TRACK_KEYS = Object.keys(TRACKS);
        let activeTrackKey = 'clair';

        const musicBtn = document.getElementById('music-toggle');
        const trackSwitchBtn = document.getElementById('track-switch');
        const trackToast = document.getElementById('track-toast');
        let toastTimeout = null;

        function showTrackToast(text) {
            trackToast.innerText = text;
            trackToast.style.opacity = '1';
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { trackToast.style.opacity = '0'; }, 2600);
        }

        function midiToFreq(m) {
            return 440 * Math.pow(2, (m - 69) / 12);
        }

        function playPianoNote(midi, style) {
            if (!audioCtx || !isPlaying) return;
            const now = audioCtx.currentTime;
            const freq = midiToFreq(midi);

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const noteGain = audioCtx.createGain();

            if (style === 'chime') {
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc2.frequency.value = freq * 2;
                noteGain.gain.setValueAtTime(0.0001, now);
                noteGain.gain.linearRampToValueAtTime(0.11, now + 0.015);
                noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
            } else {
                osc1.type = 'triangle';
                osc2.type = 'sine';
                osc2.frequency.value = freq * 2;

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1100, now);
                filter.frequency.exponentialRampToValueAtTime(340, now + 2.4);

                noteGain.gain.setValueAtTime(0.0001, now);
                noteGain.gain.linearRampToValueAtTime(0.14, now + 0.035);
                noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);
            }

            osc1.frequency.value = freq;

            const subGain = audioCtx.createGain();
            subGain.gain.value = 0.25;

            osc1.connect(filter);
            osc2.connect(subGain);
            subGain.connect(filter);
            filter.connect(noteGain);
            noteGain.connect(masterGain);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 2.9);
            osc2.stop(now + 2.9);
        }

        function stopCurrentEngine() {
            clearInterval(melodyTimer);
            melodyTimer = null;
            spaceNodes.forEach(n => { try { n.stop(); } catch (e) {} });
            spaceNodes = [];
        }

        function startTrackEngine(key) {
            stopCurrentEngine();
            const track = TRACKS[key] || TRACKS.clair;

            if (track.type === 'pad') {
                const freqs = [146.83, 220.00, 277.18, 329.63, 440.00];
                freqs.forEach((f, idx) => {
                    const osc = audioCtx.createOscillator();
                    const lfo = audioCtx.createOscillator();
                    const lfoGain = audioCtx.createGain();
                    const oscGain = audioCtx.createGain();
        osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
                    osc.frequency.value = f;
                    oscGain.gain.value = 0.04;

                    lfo.frequency.value = 0.08 + idx * 0.03;
                    lfoGain.gain.value = 0.02;
                    lfo.connect(lfoGain);
                    lfoGain.connect(oscGain.gain);

                    osc.connect(oscGain);
                    oscGain.connect(masterGain);
                    osc.start();
                    lfo.start();
                    spaceNodes.push(osc, lfo);
                });
            } else {
                noteStep = 0;
                const triggerStep = () => {
                    if (!isPlaying) return;
                    const item = track.notes[noteStep % track.notes.length];
                    if (Array.isArray(item)) {
                        item.forEach((n, i) => setTimeout(() => playPianoNote(n, track.type), i * 45));
                    } else {
                        playPianoNote(item, track.type);
                    }
                    noteStep++;
                };
                triggerStep();
                melodyTimer = setInterval(triggerStep, track.tempo);
            }
        }

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.001;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleSpaceMusic() {
            initAudioContext();
            isPlaying = !isPlaying;
            const now = audioCtx.currentTime;

            if (isPlaying) {
                startTrackEngine(activeTrackKey);
                masterGain.gain.cancelScheduledValues(now);
                masterGain.gain.exponentialRampToValueAtTime(0.65, now + 0.8);
                musicBtn.innerText = '🔊';
                showTrackToast(TRACKS[activeTrackKey].name);
            } else {
                masterGain.gain.cancelScheduledValues(now);
                masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
                setTimeout(() => { if (!isPlaying) stopCurrentEngine(); }, 550);
                musicBtn.innerText = '🔇';
            }
        }

        function cycleNextTrack() {
            const nextIdx = (TRACK_KEYS.indexOf(activeTrackKey) + 1) % TRACK_KEYS.length;
            activeTrackKey = TRACK_KEYS[nextIdx];
            initAudioContext();

            if (!isPlaying) {
                isPlaying = true;
                musicBtn.innerText = '🔊';
                const now = audioCtx.currentTime;
                masterGain.gain.cancelScheduledValues(now);
                masterGain.gain.exponentialRampToValueAtTime(0.65, now + 0.6);
            }
            startTrackEngine(activeTrackKey);
            showTrackToast(TRACKS[activeTrackKey].name);
        }

        musicBtn.addEventListener('click', toggleSpaceMusic);
        trackSwitchBtn.addEventListener('click', cycleNextTrack);
        // 4. Trust Meter, Milestones & Live Day Streak Logic
        const MAX_TRUST = 1000;
        const DAILY_GROWTH = 5;
        let currentState = {
            basePercent: 50,
            baseDate: getTodayMidnight(),
            baseDay: 1,
            theme: 'violet',
            defaultTrack: 'clair',
            topCaption: 'Among The Galaxies',
            bottomCaption: 'I Found You',
            streakCaption: 'Day {day} of growing together'
        };

        function getTodayMidnight() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        }

        function getMilestoneLabel(val) {
            if (val >= 1000) return '✦ Infinite Universe (1000%)';
            if (val >= 750) return '✦ Supernova Bond (750%+)';
            if (val >= 500) return '✦ Eternal Constellation (500%+)';
            if (val >= 250) return '✦ Celestial Orbit (250%+)';
            if (val >= 100) return '✦ Rising Starlight (100%+)';
            return '✦ Cosmic Spark';
        }

        function renderAll() {
            const daysPassed = Math.max(0, Math.floor((getTodayMidnight() - Number(currentState.baseDate)) / 86400000));
            const liveTrust = Math.min(MAX_TRUST, Math.max(0, Number(currentState.basePercent) + daysPassed * DAILY_GROWTH));
            const liveDay = Math.max(1, Number(currentState.baseDay || 1) + daysPassed);

            document.getElementById('trust-value').innerText = liveTrust;
            const ratio = Math.min(1, Math.max(0, liveTrust / MAX_TRUST));
            const yPosition = 165 - (ratio * 160);
            document.getElementById('water-level').setAttribute('transform', `translate(0, ${yPosition})`);

            document.getElementById('ui-top-caption').innerText = currentState.topCaption || 'Among The Galaxies';
            document.getElementById('ui-bottom-caption').innerText = currentState.bottomCaption || 'I Found You';
            document.getElementById('ui-milestone').innerText = getMilestoneLabel(liveTrust);

            const streakTemplate = currentState.streakCaption || 'Day {day} of growing together';
            document.getElementById('ui-streak').innerText = streakTemplate.replace('{day}', liveDay);

            if (currentState.defaultTrack && TRACKS[currentState.defaultTrack]) {
                activeTrackKey = currentState.defaultTrack;
            }
            applyTheme(currentState.theme || 'violet');
        }

        async function loadGlobalTrustData() {
            if (!FIREBASE_DB_URL || FIREBASE_DB_URL.includes("PASTE_YOUR")) {
                const saved = localStorage.getItem('trust_cosmic_state');
                if (saved) currentState = { ...currentState, ...JSON.parse(saved) };
                else localStorage.setItem('trust_cosmic_state', JSON.stringify(currentState));
                renderAll();
                return;
                }
            try {
                const response = await fetch(`${FIREBASE_DB_URL}/trustData.json`);
                const data = await response.json();
                if (data && data.basePercent !== undefined) {
                    currentState = { ...currentState, ...data };
                } else {
                    await fetch(`${FIREBASE_DB_URL}/trustData.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(currentState)
                    });
                }
                renderAll();
            } catch (error) {
                console.error("Database connection error:", error);
                renderAll();
            }
        }

        // 5. Admin Modal Controls
        const modal = document.getElementById('admin-modal');
        const loginView = document.getElementById('login-view');
        const editView = document.getElementById('edit-view');
        const loginError = document.getElementById('login-error');

        document.getElementById('admin-trigger').addEventListener('click', () => {
            loginError.style.display = 'none';
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-pass').value = '';
            loginView.style.display = 'block';
            editView.style.display = 'none';
            modal.style.display = 'flex';
        });

        function closeModal() { modal.style.display = 'none'; }

        function verifyLogin() {
            const user = document.getElementById('admin-user').value.trim();
            const pass = document.getElementById('admin-pass').value;

            if (user === 'anand' && pass === '@anand2002') {
                loginView.style.display = 'none';
                editView.style.display = 'block';

                const daysPassed = Math.max(0, Math.floor((getTodayMidnight() - Number(currentState.baseDate)) / 86400000));
                document.getElementById('new-percentage').value = document.getElementById('trust-value').innerText;
                document.getElementById('theme-select').value = currentState.theme || 'violet';
                document.getElementById('music-select').value = currentState.defaultTrack || 'clair';
                document.getElementById('edit-top-caption').value = currentState.topCaption || 'Among The Galaxies';
                document.getElementById('edit-bottom-caption').value = currentState.bottomCaption || 'I Found You';
                document.getElementById('edit-day-number').value = Number(currentState.baseDay || 1) + daysPassed;
                document.getElementById('edit-streak-caption').value = currentState.streakCaption || 'Day {day} of growing together';
            } else {
                loginError.style.display = 'block';
            }
        }

        async function saveAdminSettings() {
            const inputVal = parseFloat(document.getElementById('new-percentage').value);
            const dayVal = parseInt(document.getElementById('edit-day-number').value, 10);

            if (isNaN(inputVal) || inputVal < 0 || inputVal > MAX_TRUST) {
                alert('Please enter a valid percentage between 0 and 1000.');
                return;
            }

            currentState = {
                basePercent: inputVal,
                baseDate: getTodayMidnight(),
                baseDay: isNaN(dayVal) || dayVal < 1 ? 1 : dayVal,
                theme: document.getElementById('theme-select').value,
                defaultTrack: document.getElementById('music-select').value,
                topCaption: document.getElementById('edit-top-caption').value.trim() || 'Among The Galaxies',
                bottomCaption: document.getElementById('edit-bottom-caption').value.trim() || 'I Found You',
                streakCaption: document.getElementById('edit-streak-caption').value.trim() || 'Day {day} of growing together'
            };

            if (isPlaying) {
                startTrackEngine(currentState.defaultTrack);
                showTrackToast(TRACKS[currentState.defaultTrack].name);
            }

            if (!FIREBASE_DB_URL || FIREBASE_DB_URL.includes("PASTE_YOUR")) {
                localStorage.setItem('trust_cosmic_state', JSON.stringify(currentState));
                renderAll();
                closeModal();
                return;
            }

            const saveBtn = document.getElementById('save-btn');
            saveBtn.innerText = 'Saving...';
            saveBtn.disabled = true;

            try {
                await fetch(`${FIREBASE_DB_URL}/trustData.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentState)
                });
                renderAll();
                closeModal();
            } catch (err) {
                alert('Failed to update database. Check your Firebase URL.');
            } finally {
                saveBtn.innerText = 'Save All';
                saveBtn.disabled = false;
            }
        }

        document.getElementById('admin-pass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyLogin();
        });

        loadGlobalTrustData();
    </script>
