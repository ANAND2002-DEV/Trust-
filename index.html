<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050711">
<title>Trust in the Stars</title>
<style>
:root{color-scheme:dark;--rose:#ff526f;--ivory:#f8e9e9}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#050711;color:var(--ivory);font-family:Georgia,'Times New Roman',serif;touch-action:none;user-select:none}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.cosmos{position:fixed;inset:0;pointer-events:none;z-index:0;background:
 radial-gradient(ellipse at 50% 48%,rgba(63,38,72,.2),transparent 48%),
 radial-gradient(ellipse at 14% 78%,rgba(30,49,82,.18),transparent 35%),
 linear-gradient(180deg,rgba(3,5,16,.14),rgba(3,5,16,.48))}
.milkyway{position:fixed;z-index:0;pointer-events:none;inset:-30%;
 background:radial-gradient(ellipse at 52% 50%,rgba(174,143,174,.12),transparent 10%),
 radial-gradient(ellipse at 48% 48%,rgba(107,116,160,.09),transparent 24%),
 radial-gradient(ellipse at 45% 53%,rgba(88,91,139,.07),transparent 38%);
 filter:blur(35px);transform:rotate(-24deg) scale(1.15)}
header{position:fixed;z-index:2;top:clamp(30px,7vh,74px);left:0;width:100%;text-align:center;pointer-events:none}
.kicker{font-size:10px;letter-spacing:.48em;text-transform:uppercase;color:#c7b7c9;opacity:.78}
h1{font-weight:400;font-size:clamp(22px,5vw,34px);letter-spacing:.22em;text-transform:uppercase;margin:15px 0 0;color:#f6e9e9;text-shadow:0 2px 24px #b98ba955}
.stage{position:fixed;inset:0;z-index:1;display:grid;place-items:center}
#heartMover{position:absolute;width:min(82vw,440px);aspect-ratio:1.08;display:grid;place-items:center;cursor:grab;touch-action:none;will-change:transform}
#heartMover.dragging{cursor:grabbing}
.heart-scene{position:relative;width:100%;height:100%;filter:drop-shadow(0 18px 34px rgba(0,0,0,.65))}
.heart-svg{width:100%;height:100%;overflow:visible}
.heart-shape{fill:url(#flesh);stroke:url(#edge);stroke-width:1.3}
.inner-shadow{fill:url(#innerShade);opacity:.8}
.glass-glint{fill:none;stroke:#ffe3e8;stroke-width:2;stroke-linecap:round;opacity:.24}
.vein{fill:none;stroke:#e66b7b;stroke-width:2;stroke-linecap:round;opacity:.17}
.liquid-area{opacity:.94}
.liquid-surface{fill:none;stroke:#ffb1bd;stroke-width:1.5;opacity:.82;filter:url(#glow)}
.heart-aura{fill:none;stroke:#fa4869;stroke-width:5;opacity:.13;filter:url(#blur)}
.value{position:absolute;top:51%;left:50%;transform:translate(-50%,-40%);text-align:center;width:70%;pointer-events:none;text-shadow:0 2px 18px #09030a}
.number{font-size:clamp(48px,11vw,72px);font-weight:400;line-height:1;letter-spacing:-.055em;color:#fff4f2;text-shadow:0 0 24px #ff819477}
.label{margin-top:12px;font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:#f3dfe2}
.scale{margin-top:10px;font-size:10px;letter-spacing:.2em;color:#c6aeb9}
.bottom-note{position:fixed;z-index:2;bottom:calc(30px + env(safe-area-inset-bottom));left:0;width:100%;text-align:center;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#c7b9c6;opacity:.76;pointer-events:none}
.bottom-note em{font-style:normal;color:#ff9aaa}
@media(min-width:700px){#heartMover{width:min(48vw,470px)}}
@media(prefers-reduced-motion:reduce){.milkyway{display:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas><div class="milkyway" id="milkyway"></div><div class="cosmos" id="cosmos"></div>
<header><div class="kicker">A universe of feelings</div><h1>Trust in the stars</h1></header>
<main class="stage">
<div id="heartMover" aria-label="Touch and drag the heart to move it">
<div class="heart-scene">
<svg class="heart-svg" viewBox="0 0 440 410" role="img" aria-label="A softly glowing, glass-like crimson heart">
<defs>
 <linearGradient id="flesh" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a1725"/><stop offset=".34" stop-color="#170b17"/><stop offset=".72" stop-color="#260c1b"/><stop offset="1" stop-color="#080711"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd0d6" stop-opacity=".78"/><stop offset=".35" stop-color="#ff5574" stop-opacity=".8"/><stop offset=".72" stop-color="#9c294e" stop-opacity=".6"/><stop offset="1" stop-color="#ffd2d8" stop-opacity=".48"/></linearGradient>
 <radialGradient id="innerShade" cx="48%" cy="34%" r="68%"><stop stop-color="#ffb1bd" stop-opacity=".13"/><stop offset=".55" stop-color="#160711" stop-opacity=".02"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
 <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff9ba9"/><stop offset=".13" stop-color="#f04462"/><stop offset=".56" stop-color="#bb173f"/><stop offset="1" stop-color="#570b2b"/></linearGradient>
 <clipPath id="heartClip"><path d="M220 372C187 342 39 236 39 129 39 53 132 24 220 112 308 24 401 53 401 129 401 236 253 342 220 372Z"/></clipPath>
 <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
 <filter id="liquidShadow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<path class="heart-aura" d="M220 372C187 342 39 236 39 129 39 53 132 24 220 112 308 24 401 53 401 129 401 236 253 342 220 372Z"/>
<g clip-path="url(#heartClip)">
 <path class="heart-shape" d="M220 372C187 342 39 236 39 129 39 53 132 24 220 112 308 24 401 53 401 129 401 236 253 342 220 372Z"/>
 <g id="liquid">
  <path id="liquidPath" class="liquid-area" fill="url(#red)" d="M20 354 Q110 346 220 354 T420 354 L420 400 L20 400Z"/>
  <path id="surface" class="liquid-surface" d="M20 354 Q110 346 220 354 T420 354"/>
  <path d="M40 360 Q110 352 220 360 T400 360" fill="none" stroke="#ff8a9d" stroke-opacity=".22" stroke-width="8" filter="url(#liquidShadow)"/>
 </g>
 <path class="inner-shadow" d="M220 372C187 342 39 236 39 129 39 53 132 24 220 112 308 24 401 53 401 129 401 236 253 342 220 372Z"/>
 <path class="vein" d="M218 120C203 91 174 72 151 75M220 119C242 85 271 72 293 78M84 154C86 205 126 255 164 282"/>
 <path class="glass-glint" d="M75 131C77 88 108 61 147 59M91 165C96 205 119 236 145 257"/>
</g>
<path d="M220 372C187 342 39 236 39 129 39 53 132 24 220 112 308 24 401 53 401 129 401 236 253 342 220 372Z" fill="none" stroke="url(#edge)" stroke-width="1.6"/>
</svg>
<div class="value"><div class="number">45%</div><div class="label">Trust level</div><div class="scale">out of 1000%</div></div>
</div></div>
</main>
<div class="bottom-note">Touch &amp; drag <em>·</em> move the heart through the night</div>
<script>
(()=>{
 const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');let w,h,dpr,stars=[];\n const milkyway=document.getElementById('milkyway'),cosmos=document.getElementById('cosmos');\n let pointerX=0,pointerY=0,targetX=0,targetY=0;
 function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  stars=Array.from({length:Math.min(650,Math.floor(w*h/1500))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*.95+.12,a:Math.random()*.55+.12,p:Math.random()*7,s:.00025+Math.random()*.0008}));}
 function draw(t){
  ctx.clearRect(0,0,w,h);
  // A gentle, layered parallax: nearer stars travel farther than distant stars.
  pointerX += (targetX-pointerX)*.045; pointerY += (targetY-pointerY)*.045;
  for(const q of stars){
    const depth=q.r>0.72?1:.42;
    const px=((q.x + pointerX*depth + w)%(w+1));
    const py=((q.y + pointerY*depth + h)%(h+1));
    ctx.globalAlpha=q.a*(.72+.28*Math.sin(t*q.s+q.p));
    ctx.fillStyle='#fff8f4';ctx.beginPath();ctx.arc(px,py,q.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  milkyway.style.transform=`translate3d(${pointerX*.22}px,${pointerY*.22}px,0) rotate(-24deg) scale(1.15)`;
  cosmos.style.transform=`translate3d(${pointerX*.1}px,${pointerY*.1}px,0)`;
  requestAnimationFrame(draw)
 }
 function moveSky(e){
  targetX=(e.clientX-w/2)*-.055;
  targetY=(e.clientY-h/2)*-.055;
 }
 addEventListener('pointermove',moveSky,{passive:true});
 addEventListener('deviceorientation',e=>{
  if(e.gamma!==null && e.beta!==null){
   targetX=Math.max(-18,Math.min(18,e.gamma*.45));
   targetY=Math.max(-18,Math.min(18,e.beta*.25));
  }
 },{passive:true});
 addEventListener('resize',resize);resize();requestAnimationFrame(draw);
 // 45 on a 0–1000 scale = 4.5% of the vessel; the red pool stays visible as a fine luminous base.
 const fraction=45/1000, y=354+(1-fraction)*0; // subtle low pool, matching the numeric scale
 const liquid=document.getElementById('liquid');
 liquid.style.transform=`translateY(${Math.max(0, (1-fraction)*24)}px)`;
 const mover=document.getElementById('heartMover');let dragging=false,sx=0,sy=0,ox=0,oy=0,x=0,y=0;
 mover.addEventListener('pointerdown',e=>{dragging=true;mover.classList.add('dragging');mover.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=x;oy=y});
 mover.addEventListener('pointermove',e=>{if(!dragging)return;const r=mover.getBoundingClientRect(),mx=Math.max(0,innerWidth/2-r.width/2-6),my=Math.max(0,innerHeight/2-r.height/2-6);x=Math.max(-mx,Math.min(mx,ox+e.clientX-sx));y=Math.max(-my,Math.min(my,oy+e.clientY-sy));mover.style.transform=`translate3d(${x}px,${y}px,0)`});
 const stop=()=>{dragging=false;mover.classList.remove('dragging')};mover.addEventListener('pointerup',stop);mover.addEventListener('pointercancel',stop);
})();
</script>
</body></html>
