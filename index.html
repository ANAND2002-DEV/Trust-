<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Meter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            position: relative;
        }

        /* Starry Night Sky */
        #stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Main Content */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .heart-wrapper {
            position: relative;
            width: 260px;
            height: 240px;
            filter: drop-shadow(0 0 25px rgba(255, 42, 109, 0.6));
            animation: floatHeart 4s ease-in-out infinite;
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        svg.heart-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Liquid Water Waves */
        .water-group {
            transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .wave-back {
            fill: rgba(0, 210, 255, 0.55);
            animation: waveMove 6s linear infinite;
        }

        .wave-front {
            fill: rgba(58, 123, 213, 0.85);
            animation: waveMove 4s linear infinite reverse;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-200px); }
        }

        /* Meter Text */
        .meter-info {
            margin-top: 25px;
        }

        .percentage-display {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
        }

        .percentage-display span {
            font-size: 1.4rem;
            color: #a0c4ff;
            font-weight: 400;
        }

        .label-text {
            margin-top: 8px;
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #cbd5e1;
        }

        /* Hidden Admin Trigger */
        #admin-trigger {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 10;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 18px;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 8px;
        }

        #admin-trigger:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-box {
            background: #131b2e;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 28px;
            border-radius: 16px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .modal-box h3 {
            margin-bottom: 18px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .modal-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .modal-box input:focus {
            border-color: #38bdf8;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background: #0284c7;
            color: white;
        }

        .btn-secondary {
            background: #334155;
            color: #cbd5e1;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Starry Sky -->
    <div id="stars-container"></div>

    <!-- Heart & Meter -->
    <div class="container">
        <div class="heart-wrapper">
            <svg class="heart-svg" viewBox="0 0 200 185">
                <defs>
                    <!-- Heart Shape Clip Path -->
                    <clipPath id="heart-clip">
                        <path d="M100,175 C100,175 15,115 15,58 C15,28 38,10 64,10 C82,10 95,20 100,32 C105,20 118,10 136,10 C162,10 185,28 185,58 C185,115 100,175 100,175 Z" />
                    </clipPath>
                </defs>

                <!-- Heart Background -->
                <path d="M100,175 C100,175 15,115 15,58 C15,28 38,10 64,10 C82,10 95,20 100,32 C105,20 118,10 136,10 C162,10 185,28 185,58 C185,115 100,175 100,175 Z" 
                      fill="rgba(255, 255, 255, 0.06)" />

                <!-- Liquid Water Inside Heart -->
                <g clip-path="url(#heart-clip)">
                    <g id="water-level" class="water-group" transform="translate(0, 165)">
                        <!-- Back Wave -->
                        <path class="wave-back" d="M0,10 Q50,0 100,10 T200,10 T300,10 T400,10 V200 H0 Z" />
                        <!-- Front Wave -->
                        <path class="wave-front" d="M0,12 Q50,22 100,12 T200,12 T300,12 T400,12 V200 H0 Z" />
                    </g>
                </g>

                <!-- Glowing Heart Border -->
                <path d="M100,175 C100,175 15,115 15,58 C15,28 38,10 64,10 C82,10 95,20 100,32 C105,20 118,10 136,10 C162,10 185,28 185,58 C185,115 100,175 100,175 Z" 
                      fill="none" stroke="#ff2a6d" stroke-width="4" />
            </svg>
        </div>

        <div class="meter-info">
            <div class="percentage-display">
                <strong id="trust-value">50</strong>% <span>/ 1000%</span>
            </div>
            <div class="label-text">Trust Meter</div>
        </div>
    </div>

    <!-- Subtle Admin Button -->
    <button id="admin-trigger" title="Settings">⚙️</button>

    <!-- Admin Login & Edit Modal -->
    <div id="admin-modal" class="modal-overlay">
        <div class="modal-box" id="login-view">
            <h3>Admin Access</h3>
            <div id="login-error" class="error-msg">Invalid username or password</div>
            <input type="text" id="admin-user" placeholder="Username" autocomplete="off">
            <input type="password" id="admin-pass" placeholder="Password">
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="verifyLogin()">Login</button>
            </div>
        </div>

        <div class="modal-box" id="edit-view" style="display: none;">
            <h3>Update Trust Percentage</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 14px;">
                Set current value (0 to 1000). Auto-grows +5% daily from this point.
            </p>
            <input type="number" id="new-percentage" min="0" max="1000" step="1" placeholder="e.g. 50, 80, 200">
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                <button class="btn btn-primary" onclick="saveNewPercentage()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Generate Starry Night Background
        const starsContainer = document.getElementById('stars-container');
        const starCount = 160;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.5 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            star.style.animationDelay = `${Math.random() * 5}s`;
            starsContainer.appendChild(star);
        }

        // 2. Trust Meter Calculation Logic (+5% Daily Growth)
        const MAX_TRUST = 1000;
        const DAILY_GROWTH = 5;
        const DEFAULT_BASE = 50;

        function getTodayMidnight() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        }

        function initializeTrustData() {
            let basePercent = localStorage.getItem('trust_base_percent');
            let baseDate = localStorage.getItem('trust_base_date');

            if (basePercent === null || baseDate === null) {
                basePercent = DEFAULT_BASE;
                baseDate = getTodayMidnight();
                localStorage.setItem('trust_base_percent', basePercent);
                localStorage.setItem('trust_base_date', baseDate);
            }

            const msPerDay = 1000 * 60 * 60 * 24;
            const daysPassed = Math.max(0, Math.floor((getTodayMidnight() - Number(baseDate)) / msPerDay));
            
            let currentTrust = Number(basePercent) + (daysPassed * DAILY_GROWTH);
            if (currentTrust > MAX_TRUST) currentTrust = MAX_TRUST;
            if (currentTrust < 0) currentTrust = 0;

            updateUI(currentTrust);
        }

        function updateUI(value) {
            document.getElementById('trust-value').innerText = value;

            // Map 0% - 1000% to SVG Y-coordinates (Empty at Y=168, Full at Y=5)
            const ratio = Math.min(1, Math.max(0, value / MAX_TRUST));
            const yPosition = 168 - (ratio * 163);
            document.getElementById('water-level').setAttribute('transform', `translate(0, ${yPosition})`);
        }

        // 3. Admin Modal Logic
        const modal = document.getElementById('admin-modal');
        const loginView = document.getElementById('login-view');
        const editView = document.getElementById('edit-view');
        const loginError = document.getElementById('login-error');

        document.getElementById('admin-trigger').addEventListener('click', () => {
            loginError.style.display = 'none';
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-pass').value = '';
            loginView.style.display = 'block';
            editView.style.display = 'none';
            modal.style.display = 'flex';
        });

        function closeModal() {
            modal.style.display = 'none';
        }

        function verifyLogin() {
            const user = document.getElementById('admin-user').value.trim();
            const pass = document.getElementById('admin-pass').value;

            if (user === 'anand' && pass === '@anand2002') {
                loginView.style.display = 'none';
                editView.style.display = 'block';
                document.getElementById('new-percentage').value = document.getElementById('trust-value').innerText;
            } else {
                loginError.style.display = 'block';
            }
        }

        function saveNewPercentage() {
            const inputVal = parseFloat(document.getElementById('new-percentage').value);
            if (isNaN(inputVal) || inputVal < 0 || inputVal > MAX_TRUST) {
                alert('Please enter a valid number between 0 and 1000.');
                return;
            }

            // Reset baseline to today with the new custom percentage
            localStorage.setItem('trust_base_percent', inputVal);
            localStorage.setItem('trust_base_date', getTodayMidnight());
            
            updateUI(inputVal);
            closeModal();
        }

        // Allow pressing Enter key in inputs
        document.getElementById('admin-pass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyLogin();
        });
        document.getElementById('new-percentage').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveNewPercentage();
        });

        // Start on load
        initializeTrustData();
    </script>
</body>
</html>
</body></html>
