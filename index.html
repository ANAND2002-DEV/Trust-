<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Trust Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff2a6d;
      --secondary: #ff758f;
      --glow: rgba(255, 42, 109, 0.65);
      --nebula-1: rgba(255, 42, 109, 0.16);
      --nebula-2: rgba(114, 9, 183, 0.22);
      --bg-top: #040611;
      --bg-mid: #0b1026;
      --bg-bottom: #180c29;
      --glass-bg: rgba(15, 22, 48, 0.55);
      --glass-border: rgba(255, 255, 255, 0.14);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 20% 20%, var(--nebula-1), transparent 45%),
                  radial-gradient(circle at 80% 75%, var(--nebula-2), transparent 50%),
                  linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      transition: background 1.2s ease;
      user-select: none;
    }

    canvas#starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .aurora-orb {
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: var(--primary);
      filter: blur(130px);
      opacity: 0.14;
      z-index: 0;
      pointer-events: none;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }

    .aurora-orb.orb-2 {
      bottom: -80px;
      right: -60px;
      background: var(--secondary);
      animation-delay: -7s;
    }

    @keyframes floatOrb {
      0% { transform: translate(-20px, -20px) scale(0.95); }
      100% { transform: translate(30px, 25px) scale(1.12); }
    }
          .app-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 430px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .top-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--secondary);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.55; }
    }

    .title-heading {
      font-family: 'Cinzel', serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 20%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }

    .heart-stage {
      position: relative;
      width: 265px;
      height: 245px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 0 28px var(--glow));
    }

    .heart-stage:active {
      transform: scale(0.93);
    }

    .heart-stage.overdrive {
      animation: heartBeatOverdrive 2.4s ease-in-out infinite;
    }

    @keyframes heartBeatOverdrive {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 28px var(--glow)); }
      14% { transform: scale(1.045); filter: drop-shadow(0 0 42px var(--glow)); }
      28% { transform: scale(1); }
      42% { transform: scale(1.03); filter: drop-shadow(0 0 36px var(--glow)); }
      70% { transform: scale(1); }
    }

    svg.heart-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .wave-back {
      fill: var(--secondary);
      opacity: 0.45;
      animation: waveSlideBack 5.5s linear infinite;
    }

    .wave-front {
      fill: var(--primary);
      opacity: 0.92;
      animation: waveSlideFront 3.8s linear infinite;
    }

    @keyframes waveSlideFront {
      0% { transform: translateX(0); }
      100% { transform: translateX(-200px); }
    }

    @keyframes waveSlideBack {
      0% { transform: translateX(-200px); }
      100% { transform: translateX(0); }
    }

    .heart-readout {
      position: absolute;
      top: 47%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      width: 80%;
    }

    .trust-value {
      font-size: 2.35rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.85);
    }

    .trust-sub {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 3px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }
          .glass-card {
      width: 100%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 16px 18px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .caption-text {
      font-size: 1.02rem;
      line-height: 1.55;
      color: #f1f5f9;
      font-weight: 500;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .milestone-pill {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.09);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .milestone-pill span.tier-name {
      color: var(--secondary);
      font-weight: 600;
    }

    .music-deck {
      width: 100%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      flex: 1;
    }

    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      width: 16px;
      flex-shrink: 0;
    }

    .eq-bars span {
      display: block;
      width: 3px;
      height: 4px;
      background: var(--primary);
      border-radius: 2px;
      transition: height 0.2s;
    }

    .eq-bars.playing span:nth-child(1) { animation: eqAnim 0.7s infinite alternate; }
    .eq-bars.playing span:nth-child(2) { animation: eqAnim 0.5s infinite alternate 0.2s; }
    .eq-bars.playing span:nth-child(3) { animation: eqAnim 0.8s infinite alternate 0.1s; }

    @keyframes eqAnim {
      0% { height: 4px; }
      100% { height: 14px; }
    }

    .track-title {
      font-size: 0.82rem;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    .tap-particle {
      position: fixed;
      pointer-events: none;
      z-index: 6;
      font-size: 1.1rem;
      animation: floatParticle 1.2s ease-out forwards;
    }

    @keyframes floatParticle {
      0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; }
    }

    .gear-btn {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 8;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.25);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .gear-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(2, 4, 12, 0.86);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-panel {
      background: #0d142c;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 390px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h3 { font-size: 1.15rem; font-weight: 700; }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 500;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #070b1a;
      color: #fff;
      font-family: inherit;
      font-size: 0.92rem;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-save {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .btn-cancel {
      padding: 11px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      background: transparent;
      color: #cbd5e1;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .sync-status {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #38bdf8;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="aurora-orb"></div>
  <div class="aurora-orb orb-2"></div>

  <main class="app-shell">
    <div class="top-badge">
      <span class="pulse-dot"></span>
      <span id="liveSyncBadge">Live Trust Connection</span>
    </div>

    <h1 class="title-heading">Our Trust Universe</h1>

    <div class="heart-stage" id="heartStage" title="Tap the heart">
      <svg class="heart-svg" viewBox="0 0 200 185">
        <defs>
          <clipPath id="heartClipPath">
            <path d="M100,175 C100,175 14,118 14,60 C14,30 37,10 64,10 C81,10 94,19 100,32 C106,19 119,10 136,10 C163,10 186,30 186,60 C186,118 100,175 100,175 Z"/>
          </clipPath>
          <linearGradient id="heartStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
            <stop offset="50%" stop-color="var(--secondary)" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.8"/>
          </linearGradient>
        </defs>

        <!-- Heart Glass Backdrop -->
        <path d="M100,175 C100,175 14,118 14,60 C14,30 37,10 64,10 C81,10 94,19 100,32 C106,19 119,10 136,10 C163,10 186,30 186,60 C186,118 100,175 100,175 Z"
              fill="rgba(255, 255, 255, 0.05)"
              stroke="url(#heartStrokeGrad)"
              stroke-width="3.2"/>

        <!-- Liquid Fill Group -->
        <g clip-path="url(#heartClipPath)">
          <g id="liquidLevelGroup" transform="translate(0, 185)">
            <!-- Back Wave -->
            <path class="wave-back" d="M0,0 Q50,-12 100,0 T200,0 T300,0 T400,0 V200 H0 Z"/>
            <!-- Front Wave -->
            <path class="wave-front" d="M0,2 Q50,14 100,2 T200,2 T300,2 T400,2 V200 H0 Z"/>
          </g>
          <!-- Rising Bubbles Inside Liquid -->
          <g id="liquidBubbles"></g>
        </g>

        <!-- Inner Specular Shine -->
        <path d="M42,36 C32,44 28,57 31,70" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3" stroke-linecap="round"/>
      </svg>

      <div class="heart-readout">
        <div class="trust-value" id="trustPercentText">0%</div>
        <div class="trust-sub" id="trustSubLabel">Loading...</div>
      </div>
    </div>

    <section class="glass-card">
      <div class="caption-text" id="milestoneCaption">Connecting to the stars...</div>
      <div class="milestone-pill">
        <span>Current Tier</span>
        <span class="tier-name" id="tierBadgeText">Spark of Trust</span>
      </div>
    </section>

    <section class="music-deck">
      <div class="track-info">
        <div class="eq-bars" id="eqBars">
          <span></span><span></span><span></span>
        </div>
        <div class="track-title" id="trackTitleDisplay">Midnight Stargazing</div>
      </div>
      <div class="music-controls">
        <button class="icon-btn" id="prevTrackBtn" title="Previous Track">⏮</button>
        <button class="icon-btn" id="playPauseBtn" title="Play / Pause">▶</button>
        <button class="icon-btn" id="nextTrackBtn" title="Next Track">⏭</button>
      </div>
    </section>
  </main>

  <button class="gear-btn" id="openAdminBtn" title="Admin Settings">⚙</button>

  <!-- Admin Settings Modal -->
  <div class="modal-backdrop" id="adminModal">
    <div class="modal-panel">
      <div class="modal-header">
        <h3>Admin Controls</h3>
        <button class="icon-btn" id="closeAdminBtn" style="width:28px;height:28px;">✕</button>
      </div>

      <div id="adminLoginBox">
        <div class="form-group">
          <label>Admin Password</label>
          <input type="password" id="adminPassField" placeholder="Enter your secret password" />
        </div>
        <div class="modal-actions">
          <button class="btn-save" id="unlockAdminBtn">Unlock Controls</button>
          <button class="btn-cancel" id="cancelLoginBtn">Cancel</button>
        </div>
      </div>

      <div id="adminEditorBox" style="display:none;">
        <div class="form-group">
          <label>Trust Level (0% to 1000%)</label>
          <input type="number" id="editTrustInput" min="0" max="1000" />
        </div>
        <div class="form-group">
          <label>Daily Auto-Growth (% per day)</label>
          <input type="number" id="editGrowthInput" min="0" max="100" step="1" />
        </div>
        <div class="form-group">
          <label>Personal Caption / Message</label>
          <textarea id="editCaptionInput" rows="2" placeholder="Write something meaningful..."></textarea>
        </div>
        <div class="form-group">
          <label>Sky & Heart Theme</label>
          <select id="editThemeInput">
            <option value="crimson">Crimson Rose (Romantic Pink/Red)</option>
            <option value="aurora">Aurora Borealis (Cyan & Emerald)</option>
            <option value="violet">Cosmic Violet (Deep Purple & Magenta)</option>
            <option value="gold">Starlight Gold (Warm Amber & Gold)</option>
            <option value="ocean">Midnight Sapphire (Deep Blue & Sky)</option>
          </select>
        </div>
        <div class="form-group">
          <label>GitHub Token (Saved only on this phone)</label>
          <input type="password" id="editTokenInput" placeholder="github_pat_..." />
        </div>
        <div class="modal-actions">
          <button class="btn-save" id="saveGitHubBtn">Save & Update Live</button>
          <button class="btn-cancel" id="closeEditorBtn">Close</button>
        </div>
        <div class="sync-status" id="syncStatusText"></div>
      </div>
    </div>
  </div>
    <script>
    // ==========================================
    // REPOSITORY & ADMIN CONFIGURATION
    // ==========================================
    const GITHUB_OWNER = "ANAND2002-DEV";
    const GITHUB_REPO  = "Trust-";
    const DATA_PATH    = "data.json";
    const ADMIN_SECRET = "anand123"; // Change if desired
    // ==========================================

    const THEME_PRESETS = {
      crimson: {
        primary: "#ff2a6d",
        secondary: "#ff758f",
        glow: "rgba(255, 42, 109, 0.65)",
        nebula1: "rgba(255, 42, 109, 0.18)",
        nebula2: "rgba(114, 9, 183, 0.22)",
        top: "#040611",
        mid: "#0b1026",
        bottom: "#180c29"
      },
      aurora: {
        primary: "#00f5d4",
        secondary: "#00bbf9",
        glow: "rgba(0, 245, 212, 0.58)",
        nebula1: "rgba(0, 245, 212, 0.16)",
        nebula2: "rgba(0, 187, 249, 0.20)",
        top: "#030912",
        mid: "#061826",
        bottom: "#092635"
      },
      violet: {
        primary: "#c77dff",
        secondary: "#e0aaff",
        glow: "rgba(199, 125, 255, 0.62)",
        nebula1: "rgba(157, 78, 221, 0.20)",
        nebula2: "rgba(60, 9, 108, 0.28)",
        top: "#050311",
        mid: "#100826",
        bottom: "#210b3b"
      },
      gold: {
        primary: "#ffb703",
        secondary: "#ffd166",
        glow: "rgba(255, 183, 3, 0.60)",
        nebula1: "rgba(255, 183, 3, 0.16)",
        nebula2: "rgba(251, 133, 0, 0.18)",
        top: "#090703",
        mid: "#171207",
        bottom: "#291d08"
      },
      ocean: {
        primary: "#38bdf8",
        secondary: "#818cf8",
        glow: "rgba(56, 189, 248, 0.60)",
        nebula1: "rgba(56, 189, 248, 0.18)",
        nebula2: "rgba(79, 70, 229, 0.22)",
        top: "#030712",
        mid: "#08142b",
        bottom: "#0f2347"
      }
    };

    const TRUST_TIERS = [
      { min: 0,   label: "Spark of Trust",       sub: "Growing Stronger" },
      { min: 50,  label: "Deepening Bond",       sub: "Heart Synced" },
      { min: 100, label: "100% Full Heart",      sub: "Unbreakable" },
      { min: 250, label: "Beyond Limits",        sub: "Overdrive Mode" },
      { min: 500, label: "Cosmic Soulmates",     sub: "Infinite Orbit" },
      { min: 800, label: "1000% Eternal Universe", sub: "Beyond the Stars" }
    ];

    let trustState = {
      baseTrust: 100,
      lastUpdated: new Date().toISOString(),
      dailyGrowth: 5,
      caption: "Every day with you builds something unbreakable.",
      theme: "crimson"
    };

    function applyVisualTheme(themeKey) {
      const t = THEME_PRESETS[themeKey] || THEME_PRESETS.crimson;
      const root = document.documentElement.style;
      root.setProperty("--primary", t.primary);
      root.setProperty("--secondary", t.secondary);
      root.setProperty("--glow", t.glow);
      root.setProperty("--nebula-1", t.nebula1);
      root.setProperty("--nebula-2", t.nebula2);
      root.setProperty("--bg-top", t.top);
      root.setProperty("--bg-mid", t.mid);
      root.setProperty("--bg-bottom", t.bottom);
    }

    function computeCurrentTrust(state) {
      const startMs = new Date(state.lastUpdated).getTime();
      if (isNaN(startMs)) return Math.min(1000, Math.max(0, Number(state.baseTrust) || 0));
      const elapsedDays = Math.max(0, (Date.now() - startMs) / (1000 * 60 * 60 * 24));
      const calculated = Math.round((Number(state.baseTrust) || 0) + elapsedDays * (Number(state.dailyGrowth) || 0));
      return Math.min(1000, Math.max(0, calculated));
    }

    function getTierForTrust(val) {
      let chosen = TRUST_TIERS[0];
      for (const tier of TRUST_TIERS) {
        if (val >= tier.min) chosen = tier;
      }
      return chosen;
    }

    function updateDashboardUI() {
      const livePercent = computeCurrentTrust(trustState);
      const tier = getTierForTrust(livePercent);

      document.getElementById("trustPercentText").textContent = livePercent + "%";
      document.getElementById("trustSubLabel").textContent = tier.sub;
      document.getElementById("milestoneCaption").textContent = trustState.caption;
      document.getElementById("tierBadgeText").textContent = tier.label;

      applyVisualTheme(trustState.theme);

      // Liquid fills from bottom (y=175) to top (y=8) up to 100%, stays full with overdrive heartbeat above 100%
      const fillFraction = Math.min(1, livePercent / 100);
      const targetY = 176 - (168 * fillFraction);
      document.getElementById("liquidLevelGroup").setAttribute("transform", `translate(0, ${targetY})`);

      const stage = document.getElementById("heartStage");
      if (livePercent >= 100) stage.classList.add("overdrive");
      else stage.classList.remove("overdrive");
    }
            async function fetchStateFromGitHub() {
      const badge = document.getElementById("liveSyncBadge");
      try {
        const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${DATA_PATH}?nocache=${Date.now()}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error("Waiting for data.json");
        const remoteData = await response.json();
        trustState = { ...trustState, ...remoteData };
        badge.textContent = "Synced With Universe";
      } catch (err) {
        badge.textContent = "Local Preview Mode";
      }
      updateDashboardUI();
    }

    async function pushStateToGitHub() {
      const token = document.getElementById("editTokenInput").value.trim();
      const statusLabel = document.getElementById("syncStatusText");

      if (!token) {
        statusLabel.textContent = "Please paste your GitHub Token first.";
        return;
      }

      localStorage.setItem("anand_trust_gh_pat", token);
      statusLabel.textContent = "Committing changes to GitHub...";

      const newTrustVal = Math.min(1000, Math.max(0, Number(document.getElementById("editTrustInput").value) || 0));
      const newGrowthVal = Math.min(100, Math.max(0, Number(document.getElementById("editGrowthInput").value) || 0));
      const newCaptionVal = document.getElementById("editCaptionInput").value.trim() || "Trust grows stronger every day.";
      const newThemeVal = document.getElementById("editThemeInput").value;

      const updatedData = {
        baseTrust: newTrustVal,
        lastUpdated: new Date().toISOString(),
        dailyGrowth: newGrowthVal,
        caption: newCaptionVal,
        theme: newThemeVal
      };

      const endpoint = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`;

      try {
        // Step 1: Fetch existing file SHA if data.json already exists
        let existingSha = undefined;
        const checkRes = await fetch(endpoint, {
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json"
          }
        });

        if (checkRes.ok) {
          const meta = await checkRes.json();
          existingSha = meta.sha;
        }

        // Step 2: Encode JSON safely in UTF-8 Base64 and PUT to GitHub
        const jsonString = JSON.stringify(updatedData, null, 2);
        const base64Payload = btoa(unescape(encodeURIComponent(jsonString)));

        const writeRes = await fetch(endpoint, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Update trust universe state",
            content: base64Payload,
            sha: existingSha
          })
        });

        if (!writeRes.ok) {
          const errBody = await writeRes.json().catch(() => ({}));
          throw new Error(errBody.message || "GitHub rejected the update. Check token Contents permission.");
        }

        trustState = updatedData;
        updateDashboardUI();
        statusLabel.textContent = "Saved! Live for everyone in ~30 seconds.";
      } catch (error) {
        statusLabel.textContent = "Error: " + error.message;
      }
    }

    // Modal & Admin Event Wiring
    const adminModal = document.getElementById("adminModal");
    const openAdminBtn = document.getElementById("openAdminBtn");
    const closeAdminBtn = document.getElementById("closeAdminBtn");
    const cancelLoginBtn = document.getElementById("cancelLoginBtn");
    const closeEditorBtn = document.getElementById("closeEditorBtn");

    function closeAdminModal() {
      adminModal.classList.remove("open");
      document.getElementById("syncStatusText").textContent = "";
    }

    openAdminBtn.onclick = () => {
      adminModal.classList.add("open");
      document.getElementById("editTokenInput").value = localStorage.getItem("anand_trust_gh_pat") || "";
    };

    closeAdminBtn.onclick = closeAdminModal;
    cancelLoginBtn.onclick = closeAdminModal;
    closeEditorBtn.onclick = closeAdminModal;

    document.getElementById("unlockAdminBtn").onclick = () => {
      const entered = document.getElementById("adminPassField").value;
      if (entered === ADMIN_SECRET) {
        document.getElementById("adminLoginBox").style.display = "none";
        document.getElementById("adminEditorBox").style.display = "block";
        document.getElementById("editTrustInput").value = computeCurrentTrust(trustState);
        document.getElementById("editGrowthInput").value = trustState.dailyGrowth;
        document.getElementById("editCaptionInput").value = trustState.caption;
        document.getElementById("editThemeInput").value = trustState.theme;
      } else {
        alert("Incorrect admin password.");
      }
    };

    document.getElementById("saveGitHubBtn").onclick = pushStateToGitHub;
            // Interactive Heart Tap Particles
    document.getElementById("heartStage").addEventListener("click", (e) => {
      const symbols = ["❤", "✨", "💖", "⭐", "💫"];
      for (let i = 0; i < 7; i++) {
        const el = document.createElement("span");
        el.className = "tap-particle";
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = e.clientX + "px";
        el.style.top = e.clientY + "px";
        const angle = (Math.PI * 2 * i) / 7 + (Math.random() * 0.5);
        const dist = 55 + Math.random() * 55;
        el.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
        el.style.setProperty("--dy", `${Math.sin(angle) * dist - 40}px`);
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1200);
      }
    });

    // Ambient Music Player with Track Switcher
    const PLAYLIST = [
      {
        title: "Midnight Stargazing (Ambient Piano)",
        url: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3"
      },
      {
        title: "Celestial Drift (Calm Space)",
        url: "https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3"
      },
      {
        title: "Moonlit Promise (Soft Melody)",
        url: "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3"
      }
    ];

    let currentTrack = 0;
    const bgAudio = new Audio(PLAYLIST[0].url);
    bgAudio.loop = true;

    const playPauseBtn = document.getElementById("playPauseBtn");
    const eqBars = document.getElementById("eqBars");
    const trackTitleDisplay = document.getElementById("trackTitleDisplay");

    function loadTrack(index, autoPlay) {
      currentTrack = (index + PLAYLIST.length) % PLAYLIST.length;
      bgAudio.src = PLAYLIST[currentTrack].url;
      trackTitleDisplay.textContent = PLAYLIST[currentTrack].title;
      if (autoPlay) {
        bgAudio.play().catch(() => {});
        playPauseBtn.textContent = "⏸";
        eqBars.classList.add("playing");
      }
    }

    playPauseBtn.onclick = () => {
      if (bgAudio.paused) {
        bgAudio.play().catch(() => {});
        playPauseBtn.textContent = "⏸";
        eqBars.classList.add("playing");
      } else {
        bgAudio.pause();
        playPauseBtn.textContent = "▶";
        eqBars.classList.remove("playing");
      }
    };

    document.getElementById("nextTrackBtn").onclick = () => loadTrack(currentTrack + 1, !bgAudio.paused);
    document.getElementById("prevTrackBtn").onclick = () => loadTrack(currentTrack - 1, !bgAudio.paused);

    // Starry Sky & Multi-Directional Shooting Stars
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d");
    let width = 0, height = 0;
    let starParticles = [];
    let shootingStars = [];

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      const starCount = Math.min(200, Math.floor((width * height) / 5500));
      starParticles = Array.from({ length: starCount }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.6 + 0.3,
        alpha: Math.random(),
        speed: 0.005 + Math.random() * 0.018,
        tint: Math.random() > 0.8 ? "#ffd166" : "#ffffff"
      }));
    }

    window.addEventListener("resize", initCanvas);
    initCanvas();

    function createShootingStar() {
      const direction = Math.random() > 0.5 ? 1 : -1;
      shootingStars.push({
        x: direction === 1 ? Math.random() * (width * 0.45) : width * (0.55 + Math.random() * 0.45),
        y: Math.random() * (height * 0.35),
        vx: direction * (7 + Math.random() * 5),
        vy: 3.5 + Math.random() * 4,
        len: 75 + Math.random() * 55,
        life: 1.0
      });
    }

    setInterval(() => {
      if (document.visibilityState === "visible") createShootingStar();
    }, 2800);

    function renderStarfield() {
      ctx.clearRect(0, 0, width, height);

      for (const s of starParticles) {
        s.alpha += s.speed;
        if (s.alpha >= 1 || s.alpha <= 0.12) s.speed *= -1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = s.tint;
        ctx.globalAlpha = Math.max(0.1, Math.min(1, s.alpha));
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const st = shootingStars[i];
        st.x += st.vx;
        st.y += st.vy;
        st.life -= 0.022;

        if (st.life <= 0) {
          shootingStars.splice(i, 1);
          continue;
        }

        const tailX = st.x - st.vx * 5;
        const tailY = st.y - st.vy * 5;
        const grad = ctx.createLinearGradient(st.x, st.y, tailX, tailY);
        grad.addColorStop(0, `rgba(255, 255, 255, ${st.life})`);
        grad.addColorStop(1, "rgba(255, 255, 255, 0)");

        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(st.x, st.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
      }

      requestAnimationFrame(renderStarfield);
    }

    renderStarfield();
    fetchStateFromGitHub();
    // Auto-poll GitHub every 45 seconds so the other person sees changes seamlessly
    setInterval(fetchStateFromGitHub, 45000);
  </script>
</body>
